name: Build and Push Docker Images

on:
  push:
    branches:
      - db/extra-schemas
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: backend
        push: true
        tags: ghcr.io/${{ github.repository }}-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Admin Web
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: admin-web
        push: true
        tags: ghcr.io/${{ github.repository }}-admin-web:latest
        build-args: |
          NEXT_PUBLIC_API_URL=http://64.181.185.59:5005
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Candidate App
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: candidate-app
        push: true
        tags: ghcr.io/${{ github.repository }}-candidate-app:latest
        build-args: |
          NEXT_PUBLIC_API_URL=http://64.181.185.59:5005
        cache-from: type=gha
        cache-to: type=gha,mode=max
