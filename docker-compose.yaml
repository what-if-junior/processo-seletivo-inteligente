services:
  postgres:
    image: postgres:16.2
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data/
      - ./database:/docker-entrypoint-initdb.d
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${REGISTRY}-backend:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: ${BACKEND_PORT}
      DATABASE_HOST: postgres
      WEB_ORIGIN: ${WEB_ORIGIN}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${BACKEND_PORT}/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin-web:
    image: ${REGISTRY}-admin-web:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_SERVICE_URL: ${BACKEND_SERVICE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 3000
      HOSTNAME: 0.0.0.0

  candidate-app:
    image: ${REGISTRY}-candidate-app:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
      target: candidate-app
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_SERVICE_URL: ${BACKEND_SERVICE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      PORT: 3001
      HOSTNAME: 0.0.0.0

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env

volumes:
  postgres-data: